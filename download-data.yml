
name: Download Census Income Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/download-data.yml"

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract dataset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./data

          curl -fL \
            "https://archive.ics.uci.edu/static/public/20/census+income.zip" \
            -o /tmp/census-income.zip

          unzip -o /tmp/census-income.zip -d ./data

          rm /tmp/census-income.zip

          echo "Dataset extracted to ./data"
          find ./data -maxdepth 2 -type f
