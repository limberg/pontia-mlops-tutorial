name: Build Model

on:
  push:
    branches:
      - main   # Para ejecutar la acción en cada push a la rama main => hacer git push origin main

permissions:
  contents: write # Permiso para escribir en el repositorio, claro que tambien puede clonar y leer archivos

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Staging # Carga los Secrets y Variables del entorno Staging
    steps:      
      - name: Checkout code
        uses: actions/checkout@v3 # descraga el proyecto y lopüone en ubuntu-latest

      - name: Set up Python
        uses: actions/setup-python@v5 # Instala python
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt     
      
       # Descarga el dataset
      - name: Download and extract dataset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./data/raw # Crea la carpeta donde guardar los datos

          # Descarga el dataset desde la UCI Machine Learning Repository
          curl -fL \
            "https://archive.ics.uci.edu/static/public/20/census+income.zip" \
            -o /tmp/census-income.zip

          # Descomprime el zip 
          unzip -o /tmp/census-income.zip -d ./data/raw

          rm /tmp/census-income.zip

          # Muestra los archivos descargados para verificar que todo salio bien.
          echo "Dataset extracted to ./data/raw"
          find ./data/raw -maxdepth 2 -type f

        # Entrena el modelo en el Git HUb Runnuer (Ubunto)
        # MLFlow (Azure) Guarda metricas, artefactos y registra la version del modelo
      - name: Train and save model
        run: |
          python src/main.py
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MLFLOW_URL: ${{ vars.MLFLOW_URL }}
          EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}
        
        # Publica el model.pkl como artefacto para descargarlo en build actions
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: model.pkl
          path: ./models/model.pkl
          retention-days: 30
